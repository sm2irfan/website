<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Delta Group</title>
    <!--
      GitHub Pages serves this single file for ANY unmatched path across the
      whole site — it does not support per-folder 404 pages. This repo
      publishes two client-side-routed SPAs from the same Pages site:
      production at /website/ and a preview build at /website/preview/. A
      hard reload or shared link to a deep route (e.g. /website/about or
      /website/preview/about) has no matching physical file, so it lands
      here instead of loading the app's own index.html.

      Rather than redirecting (which would change the URL and require every
      deployed index.html to cooperate in restoring it), this fetches the
      correct app's real index.html — chosen by path prefix — and swaps it
      into the current document in place. The browser's address bar and
      window.location never change, so whichever app loads reads the exact
      URL the user requested and its router mounts on the right route
      immediately, with no coordination needed from index.html itself.
    -->
    <script>
      var l = window.location
      var segments = l.pathname.split('/').filter(Boolean) // e.g. ['website'] or ['website','preview','about']
      var base = segments[1] === 'preview' ? '/website/preview/' : '/website/'

      fetch(base + 'index.html')
        .then(function (r) {
          return r.text()
        })
        .then(function (html) {
          document.open()
          document.write(html)
          document.close()
        })
    </script>
  </head>
  <body></body>
</html>
