<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 257" role="img" aria-label="Dynamic Delta">
  <!-- Hand-authored replacement for the 664KB auto-traced original. -->
  <g fill="#A62619">
    <!-- Band carrying the wordmark; starts clear of the mark's counter -->
    <rect x="240" y="78" width="715" height="122" />

    <!-- Spiral mark: outer contour and counter, holed with evenodd -->
    <path
      fill-rule="evenodd"
      d="M14 216 C45 205 75 178 99 145 A97 97 0 1 1 232 199 C170 218 85 224 14 216 Z
         M235 118 A52 52 0 1 0 131 118 A52 52 0 1 0 235 118 Z"
    />

    <text x="955" y="248" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="34">
      Since 2005
    </text>
  </g>

  <text
    x="330" y="168"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
  >
    Dynamic Delta
  </text>
</svg>
